name: Repository Dispatch Driver POC

on:
  workflow_dispatch:
    inputs:
      expected_result:
        description: Result to test in the repository_dispatch target
        required: true
        type: choice
        options:
          - clean
          - infected
        default: clean

permissions:
  contents: write

env:
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  repository-dispatch-driver:
    name: External-style repository_dispatch driver
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build scanner test image
        run: docker build --pull -f Dockerfile.dispatch-callback-poc -t zero-clamav:dispatch-callback-poc .

      - name: Seed dedicated R2 POC object
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          EXPECTED_RESULT: ${{ inputs.expected_result }}
        run: |
          test -n "$R2_ENDPOINT" || { echo 'Missing R2_ENDPOINT repository secret'; exit 1; }
          test -n "$R2_ACCESS_KEY_ID" || { echo 'Missing R2_ACCESS_KEY_ID repository secret'; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo 'Missing R2_SECRET_ACCESS_KEY repository secret'; exit 1; }
          test -n "$R2_BUCKET" || { echo 'Missing R2_BUCKET repository secret'; exit 1; }

          ATTACHMENT_ID="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          STORAGE_KEY="helpdesk/poc-quarantine/${ATTACHMENT_ID}/repository-dispatch-sample.bin"

          if [ "$EXPECTED_RESULT" = "clean" ]; then
            DATA='%PDF-1.4\n1 0 obj\n<< /Type /Catalog >>\nendobj\n%%EOF\n'
          else
            DATA="$(python3 -c 'bs=chr(92); print("X5O!P%"+bs+"@AP[4"+bs+"PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*", end="")')"
          fi

          docker run --rm \
            -e R2_ENDPOINT \
            -e R2_ACCESS_KEY_ID \
            -e R2_SECRET_ACCESS_KEY \
            -e R2_BUCKET \
            -e STORAGE_KEY="$STORAGE_KEY" \
            -e DATA="$DATA" \
            zero-clamav:dispatch-callback-poc \
            -c 'import os,boto3; from botocore.config import Config; s=boto3.client("s3",endpoint_url=os.environ["R2_ENDPOINT"],aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],region_name="auto",config=Config(signature_version="s3v4")); s.put_object(Bucket=os.environ["R2_BUCKET"],Key=os.environ["STORAGE_KEY"],Body=os.environ["DATA"].encode("ascii"))'

          echo "ATTACHMENT_ID=$ATTACHMENT_ID" >> "$GITHUB_ENV"
          echo "STORAGE_KEY=$STORAGE_KEY" >> "$GITHUB_ENV"
          echo "Seeded $STORAGE_KEY"

      - name: Send repository_dispatch event
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DISPATCH_SENT_AT="$(date -u +%s)"
          echo "DISPATCH_SENT_AT=$DISPATCH_SENT_AT" >> "$GITHUB_ENV"
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='scan_request' \
            -f client_payload[attachment_id]="$ATTACHMENT_ID" \
            -f client_payload[storage_key]="$STORAGE_KEY" \
            -f client_payload[expected_result]="${{ inputs.expected_result }}"
          echo 'REPOSITORY_DISPATCH_SENT=PASS'

      - name: Wait for repository_dispatch target workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            RUN_JSON="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dispatch-callback-poc.yml --event repository_dispatch --limit 10 --json databaseId,status,conclusion,createdAt)"
            RUN_INFO="$(python3 - "$DISPATCH_SENT_AT" <<'PY' <<< "$RUN_JSON"
import json
import sys
from datetime import datetime, timezone

rows = json.load(sys.stdin)
sent = int(sys.argv[1])
for row in rows:
    created = datetime.fromisoformat(row["createdAt"].replace("Z", "+00:00")).timestamp()
    if created >= sent:
        print(row["databaseId"], row["status"], row.get("conclusion") or "")
        break
PY
)"
            if [ -n "$RUN_INFO" ]; then
              read -r RUN_ID STATUS CONCLUSION <<< "$RUN_INFO"
              echo "Target run=$RUN_ID status=$STATUS conclusion=$CONCLUSION"
              if [ "$STATUS" = "completed" ]; then
                test "$CONCLUSION" = success
                echo 'REPOSITORY_DISPATCH_TARGET_RESULT=PASS'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Timed out waiting for repository_dispatch target workflow'
          exit 1
