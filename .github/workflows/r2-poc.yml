name: R2 ClamAV Integration POC

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  r2-clamav-poc:
    name: R2 quarantine to ClamAV POC
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build R2 POC image
        run: docker build --pull -f Dockerfile.r2-poc -t zero-clamav:r2-poc .

      - name: Run R2 quarantine, scan, safe/reject test
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          test -n "$R2_ENDPOINT" || { echo 'Missing R2_ENDPOINT repository secret'; exit 1; }
          test -n "$R2_ACCESS_KEY_ID" || { echo 'Missing R2_ACCESS_KEY_ID repository secret'; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo 'Missing R2_SECRET_ACCESS_KEY repository secret'; exit 1; }
          test -n "$R2_BUCKET" || { echo 'Missing R2_BUCKET repository secret'; exit 1; }

          docker run --rm \
            --env R2_ENDPOINT \
            --env R2_ACCESS_KEY_ID \
            --env R2_SECRET_ACCESS_KEY \
            --env R2_BUCKET \
            zero-clamav:r2-poc
